# Test Configuration for RiverFlow Server

# H2 In-Memory Database Configuration
spring.datasource.url=jdbc:h2:mem:testdb;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA Configuration for Tests
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.properties.hibernate.format_sql=true

# Disable Flyway for tests
spring.flyway.enabled=false

# Disable MongoDB for tests (we'll mock MongoDB operations)
spring.data.mongodb.auto-index-creation=false

# JWT Configuration for Tests
app.jwt.secret=testSecretKeyForJWTTokenGenerationMustBe256BitsLongMinimumForHS256AlgorithmToWorkProperlyInTestEnvironment
app.jwt.access-token-expiration-ms=3600000
app.jwt.refresh-token-expiration-ms=7200000

# Email Configuration for Tests (disabled)
spring.mail.host=localhost
spring.mail.port=25
spring.mail.username=test@test.com
spring.mail.password=test

# Application Configuration for Tests
app.frontend.url=http://localhost:3000
app.backend.url=http://localhost:8080/api
app.verification.expire-minutes=15
app.upload.dir=./test-uploads

# Disable SMTP server calls in tests
app.smtp.server.url=http://localhost:8080
app.smtp.server.api-key=test-api-key

# Google Auth Test Configuration
app.google.client-id=test-google-client-id

# Gemini Configuration for Tests
gemini.base-url=http://localhost:8080
gemini.api-key=test-api-key
gemini.model=test-model
realtime.server.url=http://localhost:8080

# Logging for Tests
logging.level.root=WARN
logging.level.com.riverflow=INFO
logging.level.org.springframework.web=WARN
logging.level.org.hibernate.SQL=WARN
